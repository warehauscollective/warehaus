name: Runner app release

# Builds Warehaus Runner (apps/mac), signs it with the Warehaus LLC Developer ID,
# notarizes and staples it, checks Gatekeeper, and publishes the zip to the
# Portal's runner app release check (production Convex). Staff download it from
# Set up runner; runners update to it between runs.
#
# - release: manual only (workflow_dispatch), from main only. Run it after a
#   production deploy that changes apps/mac or tools/runner. Deploys are manual,
#   so this never runs on push, tag or schedule.
# - dry-run: on pull requests that change the app or the runner. Builds and
#   checks the signature. No notarization, no publish. Skipped when the signing
#   secrets are missing (pull requests from forks).
#
# Repository secrets (never in the repo; see apps/mac/README.md):
#   MAC_DEVELOPER_ID_P12_BASE64, MAC_DEVELOPER_ID_P12_PASSWORD,
#   ASC_API_KEY_P8_BASE64, ASC_API_KEY_ID, ASC_API_ISSUER_ID,
#   RUNNER_APP_PUBLISH_TOKEN
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/mac/**"
      - "tools/runner/**"
      - ".github/workflows/runner-app-release.yml"

permissions:
  contents: read

concurrency:
  group: runner-app-release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dry-run:
    name: Build and check signing (no notarize, no publish)
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check for the signing secrets
        id: secrets
        env:
          P12: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [[ -n "$P12" && -n "$P12_PASSWORD" ]]; then
            echo "available=true" >>"$GITHUB_OUTPUT"
          else
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Signing secrets are not available to this pull request (a fork, or not added yet). Skipping the signed dry run."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.available == 'true'

      - name: Import the Developer ID certificate into a temporary keychain
        if: steps.secrets.outputs.available == 'true'
        env:
          MAC_DEVELOPER_ID_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        run: apps/mac/scripts/ci-keychain.sh create

      - name: Build and sign
        if: steps.secrets.outputs.available == 'true'
        run: |
          xcodebuild -version
          apps/mac/scripts/build-release.sh --skip-notarize

      - name: Delete the temporary keychain
        if: always() && steps.secrets.outputs.available == 'true'
        run: apps/mac/scripts/ci-keychain.sh delete

  release:
    name: Build, sign, notarize and publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Refuse any ref but main
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Runner app releases publish to production and run from main only, not $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # The build number is the commit count on main, so it needs full history.
          fetch-depth: 0

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          MAC_DEVELOPER_ID_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        run: apps/mac/scripts/ci-keychain.sh create

      - name: Write the App Store Connect API key
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
        run: |
          [[ -n "$ASC_API_KEY_P8_BASE64" && -n "$ASC_API_KEY_ID" ]] \
            || { echo "::error::ASC_API_KEY_P8_BASE64 and ASC_API_KEY_ID must be set."; exit 1; }
          umask 077
          key="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode >"$key"
          echo "NOTARY_KEY_PATH=$key" >>"$GITHUB_ENV"

      - name: Build, sign, notarize, staple and check Gatekeeper
        env:
          NOTARY_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcodebuild -version
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          export BUILD_NUMBER
          apps/mac/scripts/build-release.sh

      - name: Publish to the Portal (production)
        env:
          RUNNER_APP_PUBLISH_TOKEN: ${{ secrets.RUNNER_APP_PUBLISH_TOKEN }}
        run: apps/mac/scripts/publish-release.sh

      - name: Summary
        run: |
          {
            echo "### Runner app published"
            jq -r '"Version \(.version), build \(.build), sha256 `\(.sha256)`, \(.size) bytes, macOS \(.minMacOS)+"' apps/mac/build/release.json
            echo
            echo "Commit $GITHUB_SHA"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Delete the temporary keychain and the API key
        if: always()
        run: apps/mac/scripts/ci-keychain.sh delete
